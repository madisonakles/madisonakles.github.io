<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Game Chat Prototype</title>
    <style>
        :root {
            --bg-color: #000;
            --chat-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #e5e7eb;
            --text-main: #111827;
            --text-sub: #6b7280;
            --danger: #ef4444;
            --success: #10b981;
            --bubble-me: #4f46e5;
            --bubble-them: #f3f4f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden;
            background: var(--bg-color);
        }

        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        
        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: 115vw;
            height: 65vw;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column; /* Allows button to stack under chat */
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .chat-container {
            width: 380px;
            height: 550px;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header { padding: 16px; border-bottom: 1px solid var(--secondary); font-weight: 600; display: flex; justify-content: space-between; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; }
        .message.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 4px; }
        .message.me { align-self: flex-end; background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
        .input-area { padding: 16px; border-top: 1px solid var(--secondary); display: flex; gap: 10px; background: var(--chat-bg); }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid var(--secondary); border-radius: 24px; outline: none; }
        button.send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 24px; cursor: pointer; font-weight: 600; }
        
        /* Modal Styles */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(4px); z-index: 10; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: white; width: 85%; padding: 24px; border-radius: 16px; transform: translateY(10px); transition: transform 0.3s ease; }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .suggestion-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .actions { display: flex; flex-direction: column; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: transparent; color: var(--text-sub); border: 1px solid var(--secondary); padding: 10px; border-radius: 8px; cursor: pointer; }
        .btn-link { background: none; border: none; color: var(--text-sub); font-size: 0.8rem; text-decoration: underline; cursor: pointer; }

        /* The Finish Button Style */
        .finish-btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .finish-btn:hover { background: #059669; }
    </style>
</head>
<body>

<div id="video-background">
    <div id="player"></div>
</div>

<div class="main-wrapper">
    <div class="chat-container">
        <div class="chat-header">
            <span>In-Game Chat</span>
            <span style="font-size: 0.8rem; color: #10b981;">● Match Live</span>
        </div>

        <div class="chat-messages" id="messagesList">
            <div class="message them">i just got sniped</div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type here..." autocomplete="off">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>

        <div class="modal-overlay" id="interventionModal">
            <div class="modal-card">
                <h3 style="margin-top:0">Pause for a moment</h3>
                <p style="font-size: 0.9rem; color: var(--text-sub);">We detected language that might not be constructive.</p>
                <div class="suggestion-box">
                    <span id="aiSuggestionText" style="color: #166534; font-weight: 500;">...</span>
                </div>
                <div class="actions">
                    <button class="btn-primary" onclick="acceptSuggestion()">Use Suggestion</button>
                    <button class="btn-secondary" onclick="cancelSend()">Edit / Cancel</button>
                    <button class="btn-link" onclick="sendOriginal()">Send original anyway</button>
                </div>
            </div>
        </div>
    </div>

    <button class="finish-btn" onclick="finishStudy()">
        Finish Chat & Continue Survey
    </button>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const participantData = {
        userId: urlParams.get('uid') || 'anonymous_user',
        sessionStart: new Date().toISOString(),
        logs: []
    };

    let ytPlayer;
    let modalStartTime = 0;
    let originalMessage = "";

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('player', {
            videoId: 'FqbHyRvTCt8',
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'mute': 1,
                'loop': 1,
                'playlist': 'FqbHyRvTCt8'
            },
            events: {
                'onReady': (event) => event.target.playVideo()
            }
        });
    }

    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const modal = document.getElementById('interventionModal');
    const aiText = document.getElementById('aiSuggestionText');

    const toxicKeywords = ['stupid', 'idiot', 'suck', 'fuck', 'bitch'];
    const rewrites = { 'default': "let's try a different strategy", 'stupid': "i'm feeling frustrated with this match" };

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

    function handleSend() {
        const text = input.value.trim();
        if (!text) return;
        const isToxic = toxicKeywords.some(kw => text.toLowerCase().includes(kw));
        if (isToxic) {
            originalMessage = text;
            triggerIntervention(text);
        } else {
            addMessageToChat(text, 'me');
            saveLog(text, 'direct_send', 0);
            input.value = '';
        }
    }

    function triggerIntervention(text) {
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        modalStartTime = Date.now();
        aiText.textContent = rewrites[toxicKeywords.find(k => text.includes(k))] || rewrites['default'];
        modal.classList.add('active');
    }

    function getLatency() {
        return (Date.now() - modalStartTime) / 1000;
    }

    function saveLog(msg, type, latency) {
        const logEntry = {
            timestamp: new Date().toISOString(),
            content: msg,
            interactionType: type,
            latencySeconds: latency
        };
        participantData.logs.push(logEntry);
        console.log("Log saved locally:", logEntry);
    }

    window.acceptSuggestion = function() {
        const latency = getLatency();
        addMessageToChat(aiText.textContent, 'me');
        saveLog(aiText.textContent, 'accepted_suggestion', latency);
        resumeExperiment();
    };

    window.sendOriginal = function() {
        const latency = getLatency();
        addMessageToChat(originalMessage, 'me');
        saveLog(originalMessage, 'sent_original', latency);
        resumeExperiment();
    };

    window.cancelSend = function() {
        const latency = getLatency();
        saveLog(originalMessage, 'cancelled', latency);
        resumeExperiment();
    };

    function resumeExperiment() {
        modal.classList.remove('active');
        input.value = '';
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
    }

    function addMessageToChat(text, sender) {
        const div = document.createElement('div');
        div.classList.add('message', sender);
        div.textContent = text;
        document.getElementById('messagesList').appendChild(div);
        document.getElementById('messagesList').scrollTop = messagesList.scrollHeight;
    }

function finishStudy() {
    const dataString = JSON.stringify(participantData.logs);
    const encodedData = encodeURIComponent(dataString);
    
    // grab the user ID that we caught from Survey 1
    const myUserId = participantData.userId;
    
    // Survey 2 link
    const qualtricsBaseUrl = "https://qualtricsxmsm35hk9by.qualtrics.com/jfe/form/SV_8oYwbTh7QBrUbeS";
    
    // 
    const finalUrl = qualtricsBaseUrl + "?chat_logs=" + encodedData + "&survey1_id=" + myUserId;
    
    window.top.location.href = finalUrl;
}
    
</script>
</body>
</html>
