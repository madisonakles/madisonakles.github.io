<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Mobile Interface Mockup</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #000000;
            border: 8px solid #333;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Video Player Area */
        .video-placeholder {
            flex: 1;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            border-bottom: 1px solid #292929;
        }

        .stimuli-text {
            color: #8e8e93;
            font-size: 14px;
            font-style: italic;
            line-height: 1.4;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #444;
        }

        /* Comments Section */
        .comments-section {
            height: 320px;
            background-color: #121212;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
        }

        .comments-header {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #292929;
            color: #e1e1e1;
        }

        .comments-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }

        .comment-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #3a3a3c;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .comment-content {
            flex: 1;
        }

        .username {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            margin-bottom: 2px;
        }

        .comment-text {
            font-size: 14px;
            color: #ffffff;
            line-height: 1.3;
        }

        /* Hide scrollbar for clean aesthetic */
        .comments-list::-webkit-scrollbar {
            width: 0px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <div class="video-placeholder">
            <div class="stimuli-text">
                [visual sitmuli will go here, for example: person with a visable facial asymmetry]
            </div>
        </div>

        <div class="comments-section">
            <div class="comments-header">Comments (4)</div>
            
            <div class="comments-list">
                <div class="comment-item">
                    <div class="avatar"></div>
                    <div class="comment-content">
                        <div class="username">user_771</div>
                        <div class="comment-text">Stop hating y'all. she's beautiful</div>
                    </div>
                </div>

                <div class="comment-item">
                    <div class="avatar"></div>
                    <div class="comment-content">
                        <div class="username">dwn_to_earth</div>
                        <div class="comment-text">fake compliments are worse than insults btw</div>
                    </div>
                </div>

                <div class="comment-item">
                    <div class="avatar"></div>
                    <div class="comment-content">
                        <div class="username">vibe.check.99</div>
                        <div class="comment-text">she's so cute guys stop being mean &lt;3</div>
                    </div>
                </div>

                <div class="comment-item">
                    <div class="avatar"></div>
                    <div class="comment-content">
                        <div class="username">tea_spiller</div>
                        <div class="comment-text">i thought her body was tea 🤷</div>
                    </div>
                </div>
            </div>
            
        </div>
        
    </div>

</body>
</html>
