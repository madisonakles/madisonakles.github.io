<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychology Replication Scout</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --text: #e0e0e0;
            --green: #2ecc71;
            --orange: #e67e22;
            --red: #e74c3c;
            --purple: #9b59b6;
            --card-bg: #2d2d2d;
            --dim: #888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h1 { margin-bottom: 5px; }
        .subtitle { color: var(--dim); margin-bottom: 30px; border-bottom: 1px solid #444; padding-bottom: 15px; }

        .search-box {
            display: flex;
            gap: 10px;
            background: #252526;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input, select {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1e1e1e;
            color: white;
            font-size: 16px;
        }

        input[type="text"] { flex-grow: 1; }

        button {
            background-color: var(--purple);
            color: white;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: var(--dim); cursor: wait; }

        .results-area { display: grid; gap: 20px; }

        .card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--dim);
            padding: 20px;
            border-radius: 6px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .card.high-priority { border-left-color: var(--red); }
        .card.medium-priority { border-left-color: var(--orange); }
        .card.low-priority { border-left-color: var(--green); }

        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .tag-n { background: rgba(52, 152, 219, 0.2); color: #3498db; border: 1px solid #3498db; }
        .tag-cite { background: rgba(155, 89, 182, 0.2); color: #9b59b6; border: 1px solid #9b59b6; }
        .tag-year { background: rgba(255, 255, 255, 0.1); color: #ccc; }

        .title { font-size: 1.2em; font-weight: bold; margin-bottom: 8px; color: white; }
        .authors { color: var(--dim); font-size: 0.9em; margin-bottom: 10px; font-style: italic; }
        
        .abstract-snippet {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #ccc;
            margin-top: 10px;
            border-left: 2px solid #555;
        }

        .highlight-n { background-color: rgba(231, 76, 60, 0.3); color: white; padding: 0 4px; border-radius: 3px; }

        .actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-link { text-decoration: none; font-size: 0.9em; color: var(--purple); font-weight: bold; }
        .btn-link:hover { text-decoration: underline; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85em;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <h1>🧠 Psychology Replication Scout</h1>
    <div class="subtitle">Find high-impact psychology studies with potentially small sample sizes. Powered by OpenAlex.</div>

    <div class="search-box">
        <input type="text" id="topicInput" placeholder="Enter topic (e.g., 'Cognitive Dissonance', 'Social Priming')..." value="Social Priming">
        <select id="yearSelect">
            <option value="">Any Year</option>
            <option value="2000-2015" selected>2000-2015 (Pre-Crisis Era)</option>
            <option value="2016-2024">2016-2024 (Recent)</option>
        </select>
        <button id="searchBtn" onclick="runSearch()">Find Candidates</button>
    </div>

    <div id="results" class="results-area"></div>

<script>
    // --- 1. RECONSTRUCT ABSTRACT ---
    // OpenAlex stores abstracts as an "Inverted Index" to save space. We must rebuild it.
    function reconstructAbstract(invertedIndex) {
        if (!invertedIndex) return null;
        const sortedArray = [];
        for (const [word, positions] of Object.entries(invertedIndex)) {
            positions.forEach(pos => {
                sortedArray[pos] = word;
            });
        }
        return sortedArray.join(' ');
    }

    // --- 2. EXTRACT SAMPLE SIZE (Heuristic Regex) ---
    // Looks for patterns like "N = 40", "40 participants", "subjects were 40 students"
    function extractN(text) {
        if (!text) return null;
        
        // Regex patterns to find N
        const patterns = [
            /N\s?=\s?(\d+)/i,  // N=50
            /(\d+)\s?(?:undergraduates|participants|subjects|students)/i, // 50 undergraduates
            /sample size (?:was|of) (\d+)/i // sample size was 50
        ];

        for (let pat of patterns) {
            const match = text.match(pat);
            if (match && match[1]) {
                return {
                    number: parseInt(match[1]),
                    context: match[0],
                    fullText: text.replace(match[0], `<span class="highlight-n">${match[0]}</span>`)
                };
            }
        }
        return null;
    }

    // --- 3. SEARCH OPENALEX ---
    async function runSearch() {
        const topic = document.getElementById('topicInput').value;
        const yearRange = document.getElementById('yearSelect').value;
        const resultsDiv = document.getElementById('results');
        const btn = document.getElementById('searchBtn');

        if (!topic) return;

        btn.disabled = true;
        btn.innerText = 'Scouting...';
        resultsDiv.innerHTML = '<div style="text-align:center; color:#888;">Searching metadata and parsing abstracts...</div>';

        // Filter Construction
        // Concept ID for Psychology is C15744967
        let filter = `concepts.id:C15744967,title.search:${encodeURIComponent(topic)}`;
        
        if (yearRange === '2000-2015') filter += ',publication_year:2000-2015';
        if (yearRange === '2016-2024') filter += ',publication_year:2016-2024';

        // We sort by cited_by_count to find "High Impact" papers first
        const url = `https://api.openalex.org/works?filter=${filter}&sort=cited_by_count:desc&per-page=20`;

        try {
            const resp = await fetch(url);
            const data = await resp.json();
            
            displayResults(data.results);
        } catch (e) {
            resultsDiv.innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`;
        }
        
        btn.disabled = false;
        btn.innerText = 'Find Candidates';
    }

    // --- 4. DISPLAY LOGIC ---
    function displayResults(papers) {
        const container = document.getElementById('results');
        container.innerHTML = '';

        if (papers.length === 0) {
            container.innerHTML = '<div style="padding:20px;">No results found. Try a broader topic.</div>';
            return;
        }

        papers.forEach(paper => {
            // Reconstruct abstract
            const abstractRaw = reconstructAbstract(paper.abstract_inverted_index);
            const nData = extractN(abstractRaw);
            
            // Logic for "Replication Candidate"
            // High citations + Low N = High Priority
            let priorityClass = 'low-priority';
            let priorityLabel = 'Verified / Robust';
            
            // Heuristic: If N < 50 and Citations > 100, it's a high interest target
            if (nData && nData.number < 50 && paper.cited_by_count > 100) {
                priorityClass = 'high-priority';
                priorityLabel = '🔥 Prime Replication Candidate';
            } else if (nData && nData.number < 100) {
                priorityClass = 'medium-priority';
                priorityLabel = '⚠️ Small Sample';
            } else if (!nData) {
                priorityClass = 'card'; // Neutral
                priorityLabel = '❓ N Not Found in Abstract';
            } else {
                priorityClass = 'low-priority';
                priorityLabel = '✅ Large Sample';
            }

            const card = document.createElement('div');
            card.className = `card ${priorityClass}`;

            const authors = paper.authorships.map(a => a.author.display_name).slice(0,3).join(', ') + (paper.authorships.length > 3 ? ' et al.' : '');
            
            // Snippet display
            let abstractHtml = abstractRaw 
                ? (nData ? nData.fullText.substring(0, 300) + "..." : abstractRaw.substring(0, 300) + "...") 
                : "<em>No abstract available via API.</em>";

            card.innerHTML = `
                <div class="stats-bar">
                    <span>${priorityLabel}</span>
                    <span>${paper.publication_year}</span>
                </div>
                <div class="title">${paper.title}</div>
                <div class="authors">${authors}</div>
                
                <div style="margin: 10px 0;">
                    <span class="tag tag-cite">Cited by ${paper.cited_by_count}</span>
                    ${nData ? `<span class="tag tag-n">N = ${nData.number}</span>` : ''}
                    <span class="tag tag-year">${paper.primary_location?.source?.display_name || 'Unknown Journal'}</span>
                </div>

                <div class="abstract-snippet">
                    "${abstractHtml}"
                </div>

                <div class="actions">
                    <a href="${paper.doi}" target="_blank" class="btn-link">🔗 DOI</a>
                    <a href="https://scholar.google.com/scholar?q=${encodeURIComponent(paper.title)}" target="_blank" class="btn-link">🎓 Google Scholar</a>
                    <a href="${paper.id}" target="_blank" class="btn-link">📄 OpenAlex Record</a>
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>

</body>
</html>
