    <style>
        /* --- GLOBAL STYLES --- */
        :root { --bg-color: #ffffff; --text-color: #333333; --accent-color: #555555; --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { font-family: var(--font-main); color: var(--text-color); background-color: var(--bg-color); margin: 0; padding: 40px 20px; text-align: center; }

        /* --- NAV BAR --- */
        nav { max-width: 800px; margin: 0 auto 40px auto; border-bottom: 1px solid #eee; padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .site-title { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; color: black; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: var(--accent-color); font-size: 0.9rem; transition: color 0.2s; display: flex; align-items: center; }
        .nav-links a:hover { color: black; text-decoration: underline; }
        .icon-svg { width: 18px; height: 18px; fill: currentColor; }
        .social-link:hover { text-decoration: none !important; }
        .nav-divider { color: #eee; margin-left: 20px; font-size: 1.2rem; }
        
        /* --- MOBILE STYLES (UPDATED) --- */
        @media (max-width: 600px) { 
            nav { flex-direction: column; align-items: flex-start; } 
            .nav-links { margin-top: 15px; flex-wrap: wrap; } 
            .nav-divider { display: none; } 
            
            /* ALIGNMENT FIX: Remove left indent, add right spacing */
            .nav-links a { 
                margin-left: 0; 
                margin-right: 20px; 
                margin-bottom: 5px; 
            }
        }

        /* --- BRAIN HUB --- */
        .brain-container { 
            position: relative; 
            display: inline-block; 
            width: 100%; 
            max-width: 500px; 
            margin: 50px auto 10px auto; 
        }
        .brain-img { 
            width: 100%; 
            height: auto; 
            filter: grayscale(100%); 
            transition: filter 0.5s;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .brain-container:hover .brain-img { filter: grayscale(0%); }

        /* HOTSPOTS */
        .hotspot { position: absolute; width: 25px; height: 25px; background: rgba(0, 0, 0, 0.4); border: 2px solid #fff; border-radius: 50%; cursor: pointer; transition: transform 0.2s, background 0.2s; z-index: 10; }
        .hotspot:hover { transform: scale(1.3); background: #000; }

        /* TOOLTIPS */
        .hotspot .tooltip { visibility: hidden; width: 160px; background-color: #000; color: #fff; text-align: center; border-radius: 6px; padding: 10px; position: absolute; z-index: 1; bottom: 150%; left: 50%; margin-left: -80px; opacity: 0; transition: opacity 0.3s; font-size: 0.85rem; pointer-events: none; }
        .hotspot .tooltip::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px; border-width: 5px; border-style: solid; border-color: black transparent transparent transparent; }
        .hotspot:hover .tooltip { visibility: visible; opacity: 1; }

        /* CAPTION STYLE */
        .caption { font-size: 0.75rem; color: #999; margin-bottom: 50px; font-style: italic;}
    </style>
</head>
