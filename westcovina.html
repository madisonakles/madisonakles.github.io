<!DOCTYPE html>
<html>
<head>
    <title>West Covina Postal Panic: 626 Edition</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: 'Courier New', monospace; }
        #gameCanvas { display: block; margin: 0 auto; background: #333; border: 2px solid #555; cursor: crosshair; }
        
        /* UI Overlay */
        #ui {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px;
            pointer-events: none; font-size: 18px; z-index: 10;
        }
        
        /* Message Box */
        #message-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 50, 0, 0.95); color: white; padding: 30px;
            text-align: center; border: 4px solid white; display: none;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5); width: 450px; z-index: 20;
        }

        #stun-msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #ff0000; font-size: 40px; font-weight: bold; 
            text-shadow: 2px 2px black; display: none; pointer-events: none;
            z-index: 15;
            text-transform: uppercase;
        }
        
        /* Coordinate Debugger (Bottom Left) */
        #debug-coords {
            position: absolute; bottom: 10px; left: 10px; color: yellow;
            background: rgba(0,0,0,0.5); padding: 5px; font-size: 14px;
        }

        h1 { margin: 0 0 15px 0; font-size: 28px; text-transform: uppercase; color: #ffcc00; }
        .btn {
            background: #ffcc00; color: black; border: none; padding: 15px 30px;
            font-size: 18px; cursor: pointer; font-weight: bold; margin-top: 20px; border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="ui">
    <div><b>STOPS:</b> <span id="score">0</span>/6</div>
    <div><b>NEXT:</b> <span id="target" style="color:#ffcc00">Loading...</span></div>
    <div><b>TIME:</b> <span id="timer">0</span>s</div>
</div>

<div id="stun-msg">CAUGHT BY THE 626 GRINCH!</div>
<div id="debug-coords">DEBUG MODE: Click map to get X/Y coordinates</div>

<div id="message-box">
    <h1 id="msg-title">WEST COVINA POSTAL PANIC</h1>
    <p>
        <b>MISSION:</b><br>
        1. Start at the <b>Post Office</b>.<br>
        2. Deliver to all 6 landmarks.<br>
        3. Finish your shift at <b>Tina's Tavern</b>.<br>
        <br>
        <span style="color:red">WARNING: Avoid the 626 Grinch!</span>
    </p>
    <button class="btn" onclick="startGame()">START ROUTE</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// --- CONFIGURATION ---
const SPEED = 6;
const TURN_SPEED = 0.08;

// IMPORTANT: Update these to match your 'map.png' size if it looks stretched!
const CANVAS_WIDTH = 1100; 
const CANVAS_HEIGHT = 800;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;

// --- IMAGE LOADER (From 'images' folder) ---
const images = {};
function loadImage(key, src) {
    const img = new Image();
    img.src = src;
    images[key] = img;
}

// Load assets from the subfolder
loadImage('map', 'images/map.png'); 
loadImage('truck', 'images/truck.png');
loadImage('grinch', 'images/grinch.png');

// Buildings
loadImage('usps', 'images/usps.png');
loadImage('portos', 'images/portos.png');
loadImage('hurst', 'images/hurst.png');
loadImage('hockey', 'images/hockey.png');
loadImage('donut', 'images/donut.png');
loadImage('stadium', 'images/stadium.png');
loadImage('theater', 'images/theater.png');
loadImage('tavern', 'images/tavern.png');

// --- GAME STATE ---
let player = { x: 860, y: 150, angle: Math.PI, speed: 0 }; 
let keys = {};
let deliveriesMade = 0;
let startTime = 0;
let isGameRunning = false;
let isStunned = false;
let grinch = { x: 500, y: 400, size: 24, timer: 0 };

/**
 * LOCATIONS
 * USE THE DEBUG CLICKER to find the real X/Y for your map image!
 * Update these numbers below.
 */
const locations = [
    { name: "USPS Post Office", x: 860, y: 130, w: 40, h: 40, color: "blue", delivered: true, type: "depot", img: 'usps' },
    
    // Delivery Sequence
    { name: "Porto's Bakery", x: 920, y: 120, w: 50, h: 40, color: "orange", delivered: false, type: "building", img: 'portos' },
    { name: "Hurst Ranch", x: 300, y: 250, w: 50, h: 50, color: "green", delivered: false, type: "building", img: 'hurst' },
    { name: "CSHA Hockey", x: 380, y: 300, w: 50, h: 40, color: "cyan", delivered: false, type: "building", img: 'hockey' },
    { name: "The Donut Hole", x: 150, y: 680, w: 80, h: 40, color: "brown", delivered: false, type: "tunnel", img: 'donut' },
    { name: "Big League Dreams", x: 850, y: 650, w: 80, h: 60, color: "blue", delivered: false, type: "building", img: 'stadium' },
    { name: "Edwards Cinema", x: 1000, y: 110, w: 60, h: 50, color: "purple", delivered: false, type: "building", img: 'theater' },
    
    // Final Stop
    { name: "Tina's Tavern", x: 1070, y: 120, w: 40, h: 40, color: "red", delivered: false, type: "finish", img: 'tavern' }
];

let deliveryOrder = [1, 2, 3, 4, 5, 6, 7]; 
let currentOrderIndex = 0;

// --- INPUTS ---
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// DEBUGGER: Click map to get coordinates
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.round(e.clientX - rect.left);
    const y = Math.round(e.clientY - rect.top);
    alert(`COORDINATES FOR CODE:\nx: ${x}, y: ${y}`);
    console.log(`{ x: ${x}, y: ${y} }`); 
});

// --- GAME ENGINE ---
document.getElementById('message-box').style.display = "block";

function startGame() {
    document.getElementById('message-box').style.display = "none";
    // Reset Player to USPS (Index 0)
    let startLoc = locations[0];
    player.x = startLoc.x; 
    player.y = startLoc.y + 50; // Start slightly below the building
    player.angle = Math.PI; // Face Left
    player.speed = 0;
    
    deliveriesMade = 0;
    currentOrderIndex = 0;
    locations.forEach((l, index) => { if(index !== 0) l.delivered = false; });
    
    startTime = Date.now();
    isGameRunning = true;
    isStunned = false;
    updateUI();
    requestAnimationFrame(gameLoop);
}

function updateUI() {
    document.getElementById('score').innerText = deliveriesMade;
    let targetIndex = deliveryOrder[currentOrderIndex];
    if (targetIndex < locations.length) {
        let loc = locations[targetIndex];
        document.getElementById('target').innerText = loc.name;
        document.getElementById('target').style.color = loc.type === 'finish' ? "red" : "#ffcc00";
    }
}

function gameLoop() {
    if (!isGameRunning) return;
    updatePlayer();
    updateGrinch();
    checkDeliveries();
    draw();
    document.getElementById('timer').innerText = Math.floor((Date.now() - startTime) / 1000);
    requestAnimationFrame(gameLoop);
}

function updatePlayer() {
    // Spin if hit by Grinch
    if (isStunned) {
        player.speed *= 0.9;
        player.angle += 0.4; 
        player.x += Math.sin(player.angle) * player.speed;
        player.y -= Math.cos(player.angle) * player.speed;
        return;
    }

    if (keys['ArrowUp'] || keys['w']) player.speed = SPEED;
    else if (keys['ArrowDown'] || keys['s']) player.speed = -SPEED / 2;
    else player.speed *= 0.9; 

    if (Math.abs(player.speed) > 0.1) {
        let turn = TURN_SPEED * (player.speed > 0 ? 1 : -1);
        if (keys['ArrowLeft'] || keys['a']) player.angle -= turn;
        if (keys['ArrowRight'] || keys['d']) player.angle += turn;
    }
    
    // Move
    player.x += Math.sin(player.angle) * player.speed;
    player.y -= Math.cos(player.angle) * player.speed;

    // Keep in bounds
    if (player.x < 0) player.x = 0;
    if (player.x > CANVAS_WIDTH) player.x = CANVAS_WIDTH;
    if (player.y < 0) player.y = 0;
    if (player.y > CANVAS_HEIGHT) player.y = CANVAS_HEIGHT;
}

function updateGrinch() {
    grinch.timer++;
    // Grinch roams randomly every few seconds
    if (grinch.timer > 100) {
        grinch.x = 200 + Math.random() * 600; 
        grinch.y = 200 + Math.random() * 400; 
        grinch.timer = 0;
    }
    
    // Collision Check
    let dist = Math.hypot(player.x - grinch.x, player.y - grinch.y);
    if (dist < 40 && !isStunned) {
        triggerGrinchStun();
    }
}

function triggerGrinchStun() {
    isStunned = true;
    let msg = document.getElementById('stun-msg');
    msg.style.display = 'block';
    
    // Red flash effect
    document.body.style.backgroundColor = "#550000"; 
    setTimeout(() => { document.body.style.backgroundColor = "#111"; }, 200);

    setTimeout(() => {
        isStunned = false;
        msg.style.display = 'none';
        player.angle = Math.PI; // Reset direction roughly
    }, 2000);
}

function checkDeliveries() {
    if (currentOrderIndex >= deliveryOrder.length) return;
    let target = locations[deliveryOrder[currentOrderIndex]];
    let dist = Math.hypot(player.x - (target.x + target.w/2), player.y - (target.y + target.h/2));

    // 80px radius for delivery
    if (dist < 80 && !target.delivered) { 
        // Tunnel Logic: Must be driving through it (rough Y check)
        if(target.type === "tunnel" && Math.abs(player.y - (target.y+20)) > 40) return;

        if(target.type === 'finish') {
            if(deliveriesMade < 6) return; // Can't finish early
            endGame();
            return;
        }
        
        target.delivered = true;
        deliveriesMade++;
        currentOrderIndex++;
        updateUI();
    }
}

function endGame() {
    isGameRunning = false;
    let finalTime = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('message-box').innerHTML = `
        <h1>SHIFT COMPLETE!</h1>
        <p>You survived the loop in <b>${finalTime} seconds</b>.<br>
        Enjoy your well-earned drink at Tina's.</p>
        <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
    `;
    document.getElementById('message-box').style.display = "block";
}

function draw() {
    // 1. DRAW MAP BACKGROUND
    if (images['map'] && images['map'].complete) {
        ctx.drawImage(images['map'], 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    } else {
        // Fallback if map image is broken
        ctx.fillStyle = "#333"; 
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.fillStyle = "white";
        ctx.fillText("MISSING 'images/map.png'", 50, 50);
    }

    // 2. DRAW LOCATIONS
    locations.forEach((l, index) => {
        let img = images[l.img];
        
        if (l.delivered && l.type !== 'depot') ctx.globalAlpha = 0.5; // Dim if delivered

        if (img && img.complete && img.naturalWidth !== 0) {
            ctx.drawImage(img, l.x, l.y, l.w, l.h);
        } else {
            // Fallback Colored Box
            ctx.fillStyle = l.color;
            ctx.fillRect(l.x, l.y, l.w, l.h);
        }
        ctx.globalAlpha = 1.0;

        // Label
        ctx.fillStyle = "white";
        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;
        ctx.font = "bold 14px Arial";
        ctx.strokeText(l.name, l.x, l.y - 10);
        ctx.fillText(l.name, l.x, l.y - 10);
        
        // Bouncing Target Arrow
        if (index === deliveryOrder[currentOrderIndex]) {
            let bounce = Math.sin(Date.now() / 200) * 10;
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.moveTo(l.x + l.w/2, l.y - 30 + bounce);
            ctx.lineTo(l.x + l.w/2 - 10, l.y - 50 + bounce);
            ctx.lineTo(l.x + l.w/2 + 10, l.y - 50 + bounce);
            ctx.fill();
        }
    });

    // 3. DRAW THE 626 GRINCH
    ctx.save();
    ctx.translate(grinch.x, grinch.y);
    // Dance animation
    ctx.rotate(Math.sin(Date.now()/100)*0.3); 
    
    if (images['grinch'] && images['grinch'].complete) {
        ctx.drawImage(images['grinch'], -25, -25, 50, 50);
    } else {
        ctx.fillStyle = "#0f0"; ctx.fillRect(-20,-20,40,40);
    }
    ctx.restore();
    
    // Label for Grinch
    ctx.fillStyle = "#32CD32"; // Lime green
    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;
    ctx.font = "bold 16px Arial";
    ctx.strokeText("626 GRINCH", grinch.x - 40, grinch.y - 35);
    ctx.fillText("626 GRINCH", grinch.x - 40, grinch.y - 35);


    // 4. DRAW PLAYER (TRUCK)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    if (images['truck'] && images['truck'].complete) {
        // Draw truck (Adjust size here if your image is too big)
        ctx.drawImage(images['truck'], -15, -25, 30, 50);
    } else {
        ctx.fillStyle = "white"; ctx.fillRect(-10, -20, 20, 40);
        ctx.fillStyle = "blue"; ctx.fillRect(-10, -5, 20, 5);
    }
    
    // GPS Arrow on Hood
    if(currentOrderIndex < deliveryOrder.length && !isStunned) {
        let t = locations[deliveryOrder[currentOrderIndex]];
        let targetAngle = Math.atan2((t.y + t.h/2) - player.y, (t.x + t.w/2) - player.x);
        let relAngle = targetAngle - player.angle;
        ctx.rotate(relAngle);
        ctx.fillStyle = "#ffcc00";
        ctx.beginPath();
        ctx.moveTo(0, -35); ctx.lineTo(-8, -20); ctx.lineTo(8, -20); ctx.fill();
    }
    ctx.restore();
}
</script>
</body>
</html>
