<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallucination Checker</title>
    <script src="https://cdn.jsdelivr.net/npm/fuzzball/dist/fuzzball.umd.min.js"></script>
    <style>
        :root {
            --bg: #1e1e1e;
            --text: #c0c0c0;
            --green: #2ecc71;
            --red: #e74c3c;
            --yellow: #f1c40f;
            --cyan: #3498db;
            --dim: #666;
            --card-bg: #252526;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.5;
        }

        h1 { color: var(--text); margin-bottom: 5px; }
        
        .subtitle {
            font-size: 0.9em;
            color: var(--dim);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--dim);
            padding-bottom: 15px;
        }
        .subtitle a { color: var(--cyan); text-decoration: none; }
        .subtitle a:hover { text-decoration: underline; }

        .container { display: flex; flex-direction: column; gap: 20px; }

        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--card-bg);
            color: white;
            border: 1px solid var(--dim);
            padding: 10px;
            font-family: inherit;
            resize: vertical;
            border-radius: 4px;
        }

        button {
            background-color: var(--cyan);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            border-radius: 4px;
            align-self: flex-start;
        }

        button:hover { opacity: 0.9; }
        button:disabled { background-color: var(--dim); cursor: not-allowed; }

        .results-area { margin-top: 20px; }
        
        .card {
            background-color: var(--card-bg);
            border-left: 4px solid var(--dim);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .card.success { border-left-color: var(--green); }
        .card.danger { border-left-color: var(--red); }
        .card.warning { border-left-color: var(--yellow); }

        .status { font-weight: bold; margin-bottom: 5px; display: block; }
        .title { color: white; font-weight: bold; font-size: 1.1em; }
        .meta { color: var(--dim); font-size: 0.9em; margin-top: 5px; }
        
        .match-info {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
            font-size: 0.9em;
        }

        .spinner { display: inline-block; animation: spin 1s linear infinite; margin-right: 5px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>🔍 Reference Hallucination Checker</h1>
            <div class="subtitle">
                Adapted from <a href="https://github.com/gianlucasb/hallucinator" target="_blank">gianlucasb/hallucinator</a> for in-browser use.
            </div>
        </div>

        <p>Paste your bibliography/reference list below. This tool queries <strong>OpenAlex</strong> to verify if the papers actually exist.</p>
        
        <textarea id="inputRefs" placeholder="1. Vaswani, A., et al. (2017). Attention is all you need. In NIPS.&#10;2. Smith, J. (2025). This paper does not exist. Journal of Fake Science."></textarea>
        
        <button id="checkBtn" onclick="processReferences()">Check References</button>

        <div id="results" class="results-area"></div>
    </div>

<script>
    // --- IMPROVED Reference Parser ---
    function extractTitle(text) {
        // 1. Clean numbering (e.g., "[1]", "1.")
        let clean = text.replace(/^\[\d+\]\s*/, '').replace(/^\d+\.\s*/, '').trim();

        // 2. STRATEGY A: Look for Quoted Title (IEEE/MLA)
        const quoteMatch = clean.match(/["“](.+?)["”]/);
        if (quoteMatch && quoteMatch[1].length > 5) {
            return quoteMatch[1];
        }

        // 3. STRATEGY B: Look for Year Anchor (APA: "(2017). Title")
        // We look for the pattern (YYYY). and capture the text immediately following it.
        const dateMatch = clean.match(/\(\d{4}[a-z]?\)\.\s*/);
        if (dateMatch) {
            // Get everything after "(2017). "
            const afterDate = clean.substring(dateMatch.index + dateMatch[0].length);
            // Take the first segment before the next period
            const titlePart = afterDate.split('. ')[0];
            if (titlePart.length > 5) return titlePart.trim();
        }

        // 4. STRATEGY C: Fallback - Split by periods, but ignore initials
        // We skip parts that look like initials (length < 3)
        const parts = clean.split('.');
        let bestPart = clean;
        
        for (let part of parts) {
            part = part.trim();
            // Titles are usually long (>15 chars) and don't have many commas (authors do)
            const commaCount = (part.match(/,/g) || []).length;
            if (part.length > 15 && commaCount < 2) {
                return part;
            }
        }

        // 5. Last resort: Return the whole string (OpenAlex fuzzy search might still catch it)
        return clean;
    }

    async function queryOpenAlex(title) {
        // Remove special characters for search query
        const query = encodeURIComponent(title.replace(/[^\w\s]/gi, ''));
        const url = `https://api.openalex.org/works?filter=title.search:${query}&per-page=3`;

        try {
            const resp = await fetch(url);
            if (!resp.ok) return null;
            const data = await resp.json();
            return data.results;
        } catch (e) {
            console.error(e);
            return null;
        }
    }

    async function processReferences() {
        const input = document.getElementById('inputRefs').value;
        const resultsDiv = document.getElementById('results');
        const btn = document.getElementById('checkBtn');
        
        if (!input.trim()) return;

        resultsDiv.innerHTML = '';
        btn.disabled = true;
        btn.innerText = 'Processing...';

        const lines = input.split('\n').filter(line => line.trim().length > 10);

        for (const line of lines) {
            const card = document.createElement('div');
            card.className = 'card';
            
            // 1. Parse Title
            const extractedTitle = extractTitle(line);

            card.innerHTML = `<span class="dim"><span class="spinner">⏳</span> Checking: ${extractedTitle.substring(0, 60)}...</span>`;
            resultsDiv.appendChild(card);

            // 2. Query API
            const candidates = await queryOpenAlex(extractedTitle);
            
            // 3. Fuzzy Match Validation
            let bestMatch = null;
            let highestScore = 0;

            if (candidates && candidates.length > 0) {
                candidates.forEach(paper => {
                    const score = fuzzball.ratio(extractedTitle.toLowerCase(), paper.title.toLowerCase());
                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = paper;
                    }
                });
            }

            // 4. Render Result
            if (highestScore >= 85) {
                card.className = 'card success';
                const authors = bestMatch.authorships.map(a => a.author.display_name).slice(0, 3).join(", ");
                card.innerHTML = `
                    <span class="status" style="color:var(--green)">VERIFIED (Confidence: ${highestScore}%)</span>
                    <div class="title">${bestMatch.title}</div>
                    <div class="meta">👥 ${authors} ${bestMatch.authorships.length > 3 ? 'et al.' : ''}</div>
                    <div class="meta">📅 ${bestMatch.publication_year || 'N/A'} | 🏫 ${bestMatch.primary_location?.source?.display_name || 'Unknown Venue'}</div>
                    <div class="match-info">
                        <a href="${bestMatch.doi || bestMatch.id}" target="_blank" style="color:var(--cyan)">View Source</a>
                    </div>
                `;
            } else if (highestScore >= 60) {
                card.className = 'card warning';
                card.innerHTML = `
                    <span class="status" style="color:var(--yellow)">POTENTIAL MATCH (Confidence: ${highestScore}%)</span>
                    <div class="title">Input: ${extractedTitle}</div>
                    <div class="match-info" style="color: white">
                        Found similar: "<em>${bestMatch.title}</em>"
                    </div>
                    <div class="meta">Verify authors manually.</div>
                `;
            } else {
                card.className = 'card danger';
                card.innerHTML = `
                    <span class="status" style="color:var(--red)">POTENTIAL HALLUCINATION</span>
                    <div class="title">${extractedTitle}</div>
                    <div class="meta">No close matches found in OpenAlex database.</div>
                    <div class="meta" style="font-size:0.8em; margin-top:5px; color:#888;">Parsed as: ${extractedTitle}</div>
                `;
            }

            await new Promise(r => setTimeout(r, 200));
        }

        btn.disabled = false;
        btn.innerText = 'Check References';
    }
</script>

</body>
</html>
