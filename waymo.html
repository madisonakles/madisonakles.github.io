<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waymo Safety Research: Perception Logic</title>
    <style>
        :root {
            --waymo-blue: #0056f5;
            --waymo-cyan: #00f0ff;
            --bg-color: #050505;
            --panel-bg: #ffffff;
            --text-main: #202124;
            --text-sub: #5f6368;
        }

        body {
            font-family: 'Roboto Mono', 'Roboto', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- LEFT SIDE: 3D SIMULATION WORLD --- */
        #sim-container {
            flex: 3;
            position: relative;
            background: radial-gradient(circle at 50% 10%, #1a2a3a 0%, #050505 80%);
            perspective: 800px; /* The camera lens */
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* The 3D Stage */
        .world-stage {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(50deg) translateY(-20px); /* Camera Angle */
        }

        /* Moving Floor */
        .sim-grid {
            position: absolute;
            top: -100%; left: -100%;
            width: 300%; height: 300%;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
            background-size: 80px 80px;
            transform: translateZ(-20px);
            animation: gridMove 0.8s linear infinite;
        }

        /* The Road */
        .road-bed {
            position: absolute;
            left: 50%; top: -100%;
            width: 300px; height: 300%;
            transform: translateX(-50%);
            background: rgba(10, 10, 12, 0.8);
            border-left: 2px solid rgba(255,255,255,0.3);
            border-right: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .lane-marker {
            position: absolute;
            left: 50%; top: 0;
            width: 2px; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px, transparent 40px,
                rgba(0, 240, 255, 0.5) 40px, rgba(0, 240, 255, 0.5) 80px
            );
            animation: roadScroll 0.8s linear infinite;
        }

        /* Elements (Car, Objects) */
        .sim-object {
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        /* The Ego Car */
        #ego-car {
            bottom: 15%; left: 50%;
            width: 50px; height: 80px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            transform: translateX(-50%) rotateX(-50deg); /* Counter-rotate to stand up */
            z-index: 10;
        }
        #ego-car::after { /* Tail lights */
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
            background: #ff0055; box-shadow: 0 0 15px #ff0055;
            border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
        }

        /* The Trajectory Line */
        #trajectory-line {
            position: absolute;
            bottom: 50%; left: 50%;
            width: 6px; height: 400px;
            background: linear-gradient(to top, transparent, var(--waymo-cyan), transparent);
            transform-origin: bottom center;
            transform: translateX(-50%) rotateX(90deg); /* Lay flat on road */
            opacity: 0;
            transition: opacity 0.5s, transform 0.1s;
            border-radius: 4px;
            box-shadow: 0 0 15px var(--waymo-cyan);
            z-index: 5;
        }

        /* Obstacles */
        .obstacle {
            width: 40px; height: 40px;
            background: rgba(255, 60, 0, 0.2);
            border: 1px solid #ff3c00;
            box-shadow: 0 0 20px rgba(255, 60, 0, 0.4);
            transform: translate(-50%, -50%) rotateX(-50deg);
            display: flex; justify-content: center; align-items: center;
            color: #ff3c00; font-size: 10px; font-weight: bold;
        }

        /* --- RIGHT SIDE: CONTROLS --- */
        #panel {
            flex: 1;
            max-width: 400px;
            background-color: var(--panel-bg);
            padding: 32px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #333;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            z-index: 20;
        }

        h1 { font-size: 18px; margin: 0 0 8px 0; color: #111; }
        p { font-size: 12px; color: #666; margin-bottom: 24px; line-height: 1.5; }
        
        .toggle-container {
            display: flex; background: #f1f3f4; padding: 4px; border-radius: 8px; margin-bottom: 24px;
        }
        .toggle-btn {
            flex: 1; padding: 10px; border: none; background: transparent; 
            font-weight: 600; font-size: 12px; cursor: pointer; color: #666; border-radius: 6px;
            transition: all 0.2s;
        }
        .toggle-btn.active { background: #fff; color: var(--waymo-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* DDM Canvas */
        .ddm-wrapper {
            position: relative;
            background: #f8f9fa; border-radius: 12px; padding: 16px; margin-bottom: 20px;
            border: 1px solid #eee;
        }
        canvas#ddmCanvas { width: 100%; height: 120px; display: block; }
        
        .blur-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #333; font-size: 12px; letter-spacing: 1px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            border-radius: 12px;
        }

        /* Stats */
        .stat-box {
            display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px;
        }
        .stat-value { font-family: 'Courier New', monospace; font-weight: bold; }

        @keyframes gridMove { to { transform: translateZ(-20px) translateY(80px); } }
        @keyframes roadScroll { to { background-position: 0 80px; } }

    </style>
</head>
<body>

    <div id="sim-container">
        <div class="world-stage">
            <div class="sim-grid"></div>
            
            <div class="road-bed">
                <div class="lane-marker"></div>
                <div id="trajectory-line"></div>
            </div>

            <div id="dynamic-layer">
                <div id="ego-car" class="sim-object"></div>
                </div>
        </div>
    </div>

    <div id="panel">
        <div style="margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
            <span style="background:var(--waymo-blue); color:#fff; font-size:10px; padding:4px 8px; border-radius:4px;">RESEARCH PREVIEW</span>
        </div>
        
        <h1>Cognitive Coupling</h1>
        <p>Testing driver reaction times when AV intent is visualized (Self) vs hidden (Other).</p>

        <div class="toggle-container">
            <button class="toggle-btn active" onclick="setMode('self', this)">Extension of Self</button>
            <button class="toggle-btn" onclick="setMode('other', this)">Social Other</button>
        </div>

        <div class="stat-box">
            <span>Prediction Confidence</span>
            <span class="stat-value" id="driftVal" style="color:var(--waymo-blue)">0.00</span>
        </div>

        <div class="ddm-wrapper">
            <canvas id="ddmCanvas"></canvas>
            <div id="opaqueMask" class="blur-mask">INTERNAL STATE HIDDEN</div>
        </div>

        <div style="background:#e8f0fe; padding:15px; border-radius:8px; font-size:12px; color:var(--waymo-blue); line-height:1.4;">
            <strong id="hypothesis-title">Hypothesis:</strong>
            <span id="hypothesis-text">Visualizing trajectory allows the motor cortex to 'adopt' the car's path, reducing cognitive load.</span>
        </div>
    </div>

    <script>
        // --- 1. SETUP & CONFIG ---
        const ddmCanvas = document.getElementById('ddmCanvas');
        const ddmCtx = ddmCanvas.getContext('2d');
        const dynamicLayer = document.getElementById('dynamic-layer');
        const egoCar = document.getElementById('ego-car');
        const trajectory = document.getElementById('trajectory-line');
        const driftVal = document.getElementById('driftVal');
        
        // Canvas Sizing
        ddmCanvas.width = ddmCanvas.offsetWidth;
        ddmCanvas.height = ddmCanvas.offsetHeight;

        // State
        let mode = 'self';
        let evidence = 0;
        let decisionHistory = new Array(100).fill(0);
        let frame = 0;
        
        // Physics State
        let carPos = 0; // -1 to 1 (L/R)
        let targetPos = 0;
        let obstacles = [];

        // --- 2. CONTROL LOGIC ---
        function setMode(newMode, btn) {
            mode = newMode;
            
            // UI Toggles
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            // Visual Logic
            if (mode === 'self') {
                trajectory.style.opacity = '1';
                document.getElementById('opaqueMask').style.opacity = '0';
                document.getElementById('hypothesis-text').innerText = "Visualizing trajectory allows the motor cortex to 'adopt' the car's path, reducing cognitive load.";
            } else {
                trajectory.style.opacity = '0';
                document.getElementById('opaqueMask').style.opacity = '1';
                document.getElementById('hypothesis-text').innerText = "Hiding intent forces the brain to use 'Theory of Mind' to guess the car's actions, increasing anxiety.";
            }
        }

        // --- 3. GAME LOOP ---
        function spawnObstacle() {
            // Create DOM element
            const el = document.createElement('div');
            el.className = 'obstacle sim-object';
            el.innerText = 'OBJ';
            dynamicLayer.appendChild(el);
            
            // Logic Object
            obstacles.push({
                el: el,
                x: (Math.random() > 0.5 ? 40 : -40), // Left or Right lane (pixels from center)
                z: -800, // Start far back
                speed: 10
            });
        }

        function updatePhysics() {
            // Spawn logic
            if (frame % 150 === 0) spawnObstacle();
            frame++;

            // Obstacle Movement
            let nearestDist = 9999;
            let nearestObs = null;

            obstacles.forEach((obs, index) => {
                obs.z += obs.speed;
                
                // Update CSS 3D Position
                // We use translate3d for hardware acceleration
                // x is lateral, y is up/down (0), z is depth
                obs.el.style.transform = `translate3d(${obs.x}px, 0, ${obs.z}px) rotateX(-50deg)`;

                // Collision/Detection Logic
                const dist = Math.abs(obs.z - 0); // 0 is car Z
                if (obs.z > -400 && obs.z < 100) {
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestObs = obs;
                    }
                }

                // Cleanup
                if (obs.z > 200) {
                    obs.el.remove();
                    obstacles.splice(index, 1);
                }
            });

            // DDM Decision Logic (The Brain)
            if (nearestObs) {
                // If obstacle is on Left (-40), go Right (+1)
                const requiredDir = nearestObs.x < 0 ? 1 : -1;
                
                // Accumulate Evidence
                evidence += (requiredDir * 2); 
                evidence += (Math.random() - 0.5) * 5; // Noise
                
                // Clamp
                if (evidence > 100) evidence = 100;
                if (evidence < -100) evidence = -100;

            } else {
                // Decay to center
                evidence *= 0.9;
            }

            // Move Car based on Evidence (Threshold = 50)
            if (evidence > 50) targetPos = 75; // Move Right (pixels)
            else if (evidence < -50) targetPos = -75; // Move Left
            else targetPos = 0; // Center

            // Smooth Car physics
            carPos += (targetPos - carPos) * 0.1;
            
            // Update Ego Car CSS
            // We rotate the car slightly when banking
            const bankAngle = (targetPos - carPos) * 0.5;
            egoCar.style.transform = `translateX(${carPos}px) rotateX(-50deg) rotateZ(${bankAngle}deg)`;

            // Update Trajectory Line (The "Projected Future")
            // We curve the line by skewing it
            const skewAmount = evidence * -0.3; // Skew opposite to turn visual
            trajectory.style.transform = `translateX(-50%) rotateX(90deg) skewX(${skewAmount}deg)`;
            
            // Color shift based on confidence
            const urgency = Math.min(Math.abs(evidence), 100) / 100;
            // 120 is Green, 0 is Red in HSL. We map 0.0->1.0 to Blue->Orange
            trajectory.style.filter = `hue-rotate(${urgency * -90}deg)`;

            // Update Graphs
            updateGraph();
        }

        function updateGraph() {
            // Push data
            decisionHistory.push(evidence);
            decisionHistory.shift();

            // Stats
            driftVal.innerText = Math.abs(evidence).toFixed(1) + "%";
            driftVal.style.color = Math.abs(evidence) > 80 ? '#d93025' : '#0056f5';

            // Draw
            ddmCtx.clearRect(0, 0, ddmCanvas.width, ddmCanvas.height);
            
            const mid = ddmCanvas.height / 2;
            const scale = mid / 100;

            // Center Line
            ddmCtx.strokeStyle = '#eee';
            ddmCtx.beginPath(); ddmCtx.moveTo(0, mid); ddmCtx.lineTo(ddmCanvas.width, mid); ddmCtx.stroke();

            // Graph Line
            ddmCtx.strokeStyle = '#0056f5';
            ddmCtx.lineWidth = 2;
            ddmCtx.beginPath();
            
            const step = ddmCanvas.width / decisionHistory.length;
            
            decisionHistory.forEach((val, i) => {
                const x = i * step;
                const y = mid - (val * scale);
                if (i===0) ddmCtx.moveTo(x, y);
                else ddmCtx.lineTo(x, y);
            });
            ddmCtx.stroke();
        }

        function loop() {
            updatePhysics();
            requestAnimationFrame(loop);
        }

        // Init
        setMode('self');
        loop();

    </script>
</body>
</html>
