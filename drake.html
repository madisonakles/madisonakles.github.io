<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drake-Gotchi Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
        }

        .tamagotchi-wrapper {
            position: relative;
            width: 450px; 
            height: auto;
            display: inline-block; 
        }

        /* 1. The Shell (FRONT LAYER) */
        .shell-img {
            width: 100%;
            display: block;
            position: relative;
            z-index: 10; /* Sits ON TOP of the screen */
            pointer-events: none; 
            user-select: none;
        }

        /* 2. The Screen (BACK LAYER) */
        .game-screen {
            position: absolute;
            z-index: 1; /* Sits BEHIND the shell */
            
            /* Slightly oversized to bleed under the plastic edges */
            top: 37%;    
            left: 20%;     
            width: 44%;    
            height: 32%;   
            
            background-color: #9ea78b; /* GameBoy Green */
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px; 
            box-sizing: border-box;
        }

        /* Scanline Texture */
        .game-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* UI Styling */
        .status-bar {
            font-size: 8px;
            color: #111;
            text-shadow: 1px 1px 0px rgba(160, 172, 134, 0.8);
            margin-bottom: 2px;
        }

        .drake-avatar {
            width: 48px;
            height: 48px;
            align-self: center;
            image-rendering: pixelated; 
            animation: bounce 2s infinite;
        }

        .message-log {
            font-size: 6px;
            text-align: center;
            min-height: 8px;
            color: #111;
            margin-top: 4px;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        
        /* Sad Mode */
        .marvins-room {
            filter: grayscale(100%) contrast(120%);
            animation: none;
        }

        /* 3. Controls (TOP LAYER) */
        .controls-container {
            position: absolute;
            bottom: 12%; 
            left: 21%;
            width: 58%;
            display: flex;
            justify-content: space-between;
            z-index: 20; /* Clickable */
        }

        button {
            background: #222;
            color: #f0f0f0;
            border: 1px solid #555;
            font-family: 'Press Start 2P';
            font-size: 7px;
            padding: 5px 8px;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        button:hover {
            background: #444;
        }
        button:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

    </style>
</head>
<body>

<div class="tamagotchi-wrapper">
    <div class="game-screen" id="screen">
        <div style="width: 100%;">
            <div class="status-bar">HUNGRY: <span id="hunger-val">0</span>%</div>
            <div class="status-bar">FEELS: <span id="feels-val">0</span>%</div>
        </div>
        
        <img src="drake-pixel.png" class="drake-avatar" id="avatar">
        
        <div class="message-log" id="log">6 GOD ONLINE</div>
    </div>

    <img src="shell.png" alt="Drake Tamagotchi" class="shell-img">

    <div class="controls-container">
        <button onclick="feed('nobu')">Nobu</button>
        <button onclick="feed('henny')">Henny</button>
        <button onclick="blockText()">Block</button>
    </div>
</div>

<script>
    /* --- Game Logic --- */
    let hunger = 20;
    let feelings = 10;
    let isGameOver = false;
    let gameLoop;

    const hungerEl = document.getElementById('hunger-val');
    const feelsEl = document.getElementById('feels-val');
    const logEl = document.getElementById('log');
    const avatar = document.getElementById('avatar');

    function updateDisplay() {
        hungerEl.innerText = hunger;
        feelsEl.innerText = feelings;
        
        // "Marvins Room" Logic
        if (feelings > 70) {
            logEl.innerText = "Listening to Take Care...";
            avatar.classList.add('marvins-room');
        } else {
            avatar.classList.remove('marvins-room');
        }

        // Stats Colors
        hungerEl.style.color = hunger > 80 ? "#8b0000" : "#111";
        feelsEl.style.color = feelings > 80 ? "#8b0000" : "#111";
    }

    function log(msg) {
        logEl.innerText = msg;
        // Clear message after 2 seconds
        setTimeout(() => { 
            if(logEl.innerText === msg) logEl.innerText = "..."; 
        }, 2000);
    }

    function feed(type) {
        if (isGameOver) return;

        if (type === 'nobu') {
            hunger = Math.max(0, hunger - 20);
            feelings = Math.max(0, feelings - 5);
            log("Eating Calamari.");
        } else if (type === 'henny') {
            hunger = Math.max(0, hunger - 5);
            // Danger: Henny increases feelings fast!
            feelings = Math.min(100, feelings + 15);
            log("Sipping Henny.");
            
            // Animation Trigger
            avatar.style.animation = "shake 0.5s";
            setTimeout(() => {
                if(!avatar.classList.contains('marvins-room')) {
                    avatar.style.animation = "bounce 2s infinite";
                } else {
                    avatar.style.animation = "none";
                }
            }, 500);
        }
        updateDisplay();
    }

    function blockText() {
        if (isGameOver) return;
        
        if (feelings > 0) {
            feelings = Math.max(0, feelings - 25);
            log("Phone snatched.");
        } else {
            log("He's chilling.");
        }
        updateDisplay();
    }

    function startGame() {
        gameLoop = setInterval(() => {
            if (isGameOver) return;
            
            // Passive increase
            hunger += 2;
            feelings += 3;

            // Fail States
            if (hunger >= 100) gameOver("He starved.");
            if (feelings >= 100) gameOver("TEXT SENT: 'U UP?'");

            updateDisplay();
        }, 1000);
    }

    function gameOver(reason) {
        isGameOver = true;
        clearInterval(gameLoop);
        logEl.innerText = "GAME OVER";
        
        // Small delay so UI renders "GAME OVER" before alert
        setTimeout(() => {
            alert("GAME OVER: " + reason);
            if(confirm("Play again?")) {
                hunger = 20; feelings = 10; isGameOver = false; startGame();
            }
        }, 100);
    }

    // Initialize
    startGame();
</script>

</body>
</html>
