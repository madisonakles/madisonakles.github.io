<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drake-Gotchi: Passionfruit Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden; 
        }

        .tamagotchi-wrapper {
            position: relative;
            width: 550px; 
            height: auto;
            display: inline-block; 
        }

        /* --- LAYERS --- */
        
        /* The Shell (FRONT LAYER) */
        .shell-img {
            width: 100%;
            display: block;
            position: relative;
            z-index: 10;
            pointer-events: none; 
            user-select: none;
        }

        /* The Screen (BACK LAYER) */
        .game-screen {
            position: absolute;
            z-index: 1; 
            top: 37%;    
            left: 20%;     
            width: 44%;    
            height: 32%;   
            background-color: #9ea78b; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px; 
            box-sizing: border-box;
        }

        .game-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* --- GAME UI --- */
        .status-bar {
            font-size: 10px;
            color: #111;
            text-shadow: 1px 1px 0px rgba(160, 172, 134, 0.8);
            margin-bottom: 4px;
        }

        /* DRAKE AVATAR */
        .drake-avatar {
            width: 100px;  
            height: 100px; 
            align-self: center;
            image-rendering: pixelated; 
            animation: bounce 2s infinite;
            margin-top: -5px; 
            position: relative;
            left: -12px; 
        }

        /* LOG TEXT */
        .message-log {
            font-size: 8px;
            text-align: center;
            min-height: 10px;
            color: #111;
            margin-top: 5px;
            position: relative;
            left: -12px;
        }

        /* --- CONTROLS (ON DEVICE) --- */
        .device-btn {
            position: absolute;
            z-index: 20; 
            background: #222;
            color: #f0f0f0;
            border: 1px solid #555;
            font-family: 'Press Start 2P'; /* Font enforced */
            font-size: 8px;
            padding: 5px 4px;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-transform: uppercase;
            min-width: 50px;
        }
        
        .device-btn:hover { background: #444; color: #fff; border-color: #fff; }
        .device-btn:active { transform: translate(1px, 1px); box-shadow: none; }

        /* Adjusted positions to sit lower on the plastic shell */
        .btn-left {
            bottom: 12%; /* Moved down */
            left: 23%;
            transform: translateX(-50%);
        }
        
        .btn-mid {
            bottom: 7%; /* Moved down */
            left: 50%;
            transform: translateX(-50%);
        }

        .btn-right {
            bottom: 12%; /* Moved down */
            right: 23%;
            transform: translateX(50%);
        }

        /* --- MUSIC TOGGLE --- */
        .music-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            font-size: 10px;
            font-family: 'Press Start 2P', cursive; /* FIX: Added correct font */
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 8px;
            cursor: pointer;
            min-width: 80px;
            text-transform: uppercase;
        }

        /* --- GAME OVER MODAL --- */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); 
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #111;
            color: #fff;
            border: 4px solid #d4af37; 
            padding: 25px;
            width: 320px;
            text-align: center;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            animation: popIn 0.3s ease-out;
        }

        .modal-box h2 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 20px;
            margin-top: 0;
            line-height: 1.5;
        }

        .modal-box p {
            font-size: 10px;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #ccc;
        }

        .credit-link {
            font-size: 8px;
            color: #666;
            text-decoration: none;
            margin-bottom: 25px;
            border-bottom: 1px dotted #666;
            display: inline-block;
        }
        .credit-link:hover { color: #fff; border-bottom: 1px solid #fff; }

        .restart-btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-family: 'Press Start 2P';
            font-size: 10px;
            cursor: pointer;
            width: 100%;
        }
        .restart-btn:hover { background: #fff; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes shake {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(3px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(3px, -1px) rotate(1deg); }
            100% { transform: translate(0px, -2px) rotate(-1deg); }
        }
        .marvins-room {
            filter: grayscale(100%) contrast(120%);
            animation: none;
        }
    </style>
</head>
<body>

<button class="music-toggle" id="musicBtn" onclick="toggleMusic()">♫ ON</button>

<div id="player" style="display:none;"></div>

<div class="modal-overlay" id="gameOverModal">
    <div class="modal-box">
        <h2>GAME OVER</h2>
        <p id="fail-reason">YOU LET DRAKE TEXT HIS EX.</p>
        <p>He sent: "I miss who we were."</p>
        
        <a href="https://www.youtube.com/watch?v=MPw0Fswlrbw&list=RDMPw0Fswlrbw&start_radio=1" target="_blank" class="credit-link">
            Music Credit: 8-Bit Universe
        </a>

        <br>
        <button class="restart-btn" onclick="location.reload()">TRY AGAIN</button>
    </div>
</div>

<div class="tamagotchi-wrapper">
    <div class="game-screen" id="screen">
        <div style="width: 100%;">
            <div class="status-bar">HUNGRY: <span id="hunger-val">0</span>%</div>
            <div class="status-bar">FEELS: <span id="feels-val">0</span>%</div>
        </div>
        
        <img src="drake-pixel.png" class="drake-avatar" id="avatar">
        
        <div class="message-log" id="log">6 GOD ONLINE</div>
    </div>

    <img src="shell.png" alt="Drake Tamagotchi" class="shell-img">

    <button class="device-btn btn-left" onclick="feed('nobu')">FEED</button>
    <button class="device-btn btn-mid" onclick="feed('henny')">HENNY</button>
    <button class="device-btn btn-right" onclick="blockText()">BLOCK EX</button>
</div>

<script>
    /* --- YOUTUBE API --- */
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var isMusicPlaying = true; 

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '0',
            width: '0',
            videoId: 'MPw0Fswlrbw',
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        event.target.setVolume(50);
        event.target.playVideo();
    }

    document.addEventListener('click', function() {
        if(isMusicPlaying && player && player.getPlayerState() !== 1) {
            player.playVideo();
        }
    }, { once: true });

    function toggleMusic() {
        if (!player || !player.playVideo) return;
        const btn = document.getElementById('musicBtn');
        if (isMusicPlaying) {
            player.pauseVideo();
            btn.innerText = "♫ OFF";
            isMusicPlaying = false;
        } else {
            player.playVideo();
            btn.innerText = "♫ ON";
            isMusicPlaying = true;
        }
    }

    /* --- GAME LOGIC --- */
    let hunger = 20;
    let feelings = 10;
    let isGameOver = false;
    let gameLoop;

    const hungerEl = document.getElementById('hunger-val');
    const feelsEl = document.getElementById('feels-val');
    const logEl = document.getElementById('log');
    const avatar = document.getElementById('avatar');
    const modalOverlay = document.getElementById('gameOverModal');
    const failReasonText = document.getElementById('fail-reason');

    function updateDisplay() {
        hungerEl.innerText = hunger;
        feelsEl.innerText = feelings;
        
        if (feelings > 70) {
            if(!avatar.classList.contains('marvins-room')) {
                logEl.innerText = "Listening to Take Care...";
                avatar.classList.add('marvins-room');
            }
        } else {
            avatar.classList.remove('marvins-room');
        }

        hungerEl.style.color = hunger > 80 ? "#8b0000" : "#111";
        feelsEl.style.color = feelings > 80 ? "#8b0000" : "#111";
    }

    function log(msg) {
        logEl.innerText = msg;
        setTimeout(() => { if(logEl.innerText === msg) logEl.innerText = "..."; }, 2000);
    }

    function feed(type) {
        if (isGameOver) return;
        if (isMusicPlaying && player && player.getPlayerState() !== 1) player.playVideo();

        if (type === 'nobu') {
            hunger = Math.max(0, hunger - 20);
            feelings = Math.max(0, feelings - 5);
            log("Eating at Cheesecake.");
        } else if (type === 'henny') {
            hunger = Math.max(0, hunger - 5);
            feelings = Math.min(100, feelings + 15);
            log("Sipping Henny.");
            
            avatar.style.animation = "shake 0.5s";
            setTimeout(() => {
                if(!avatar.classList.contains('marvins-room')) {
                    avatar.style.animation = "bounce 2s infinite";
                } else {
                    avatar.style.animation = "none";
                }
            }, 500);
        }
        updateDisplay();
    }

    function blockText() {
        if (isGameOver) return;
        if (isMusicPlaying && player && player.getPlayerState() !== 1) player.playVideo();

        if (feelings > 0) {
            feelings = Math.max(0, feelings - 25);
            log("Phone snatched.");
        } else {
            log("He's chilling.");
        }
        updateDisplay();
    }

    function startGame() {
        gameLoop = setInterval(() => {
            if (isGameOver) return;
            
            hunger += 2;
            feelings += 3;

            if (hunger >= 100) triggerGameOver("He starved to death.");
            if (feelings >= 100) triggerGameOver("You let Drake text his ex.");

            updateDisplay();
        }, 1000);
    }

    function triggerGameOver(reason) {
        isGameOver = true;
        clearInterval(gameLoop);
        failReasonText.innerText = reason.toUpperCase();
        modalOverlay.style.display = 'flex';
    }

    startGame();
</script>
</body>
</html>
