<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drake-Gotchi v1.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
        }

        /* The Main Device Container */
        .tamagotchi-container {
            position: relative;
            width: 500px; /* Adjust based on your image size */
            height: auto;
        }

        /* The Plastic Shell Image */
        .shell-img {
            width: 100%;
            display: block;
            /* This ensures clicks don't drag the image */
            pointer-events: none; 
            user-select: none;
        }

        /* The LCD Screen Overlay */
        .game-screen {
            position: absolute;
            /* These percentages align with the white box in your specific image */
            top: 36%; 
            left: 27%;
            width: 46%;
            height: 29%;
            background-color: #9ea78b; /* Classic GameBoy Green */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            overflow: hidden;
            z-index: 10;
        }

        /* CRT Scanline Effect */
        .game-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        /* UI Elements */
        .status-bar {
            font-size: 8px;
            margin-bottom: 4px;
            color: #222;
        }

        .drake-avatar {
            width: 50px;
            height: 50px;
            align-self: center;
            image-rendering: pixelated;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .message-log {
            font-size: 7px;
            text-align: center;
            height: 10px;
            color: #222;
        }

        /* Controls Area (Hidden buttons mapped to the image buttons) */
        /* For this prototype, we'll put the buttons BELOW the image for ease of use, 
           or overlay them if you want true immersion. Let's do overlay. */
        
        .controls-overlay {
            position: absolute;
            bottom: 15%;
            left: 20%;
            width: 60%;
            display: flex;
            justify-content: space-between;
            z-index: 20;
        }

        button {
            background: #333;
            color: white;
            border: 2px solid #fff;
            font-family: 'Press Start 2P';
            font-size: 8px;
            padding: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        button:active {
            transform: translate(1px, 1px);
            box-shadow: 0px 0px 0px black;
        }

        /* Sad Drake Mode */
        .marvins-room {
            filter: grayscale(100%) contrast(120%);
            animation: none; /* Stop bouncing when sad */
        }
    </style>
</head>
<body>

<div class="tamagotchi-container">
    <img src="shell.png" alt="Drake Tamagotchi" class="shell-img">

    <div class="game-screen" id="screen">
        <div class="status-bar">HUNGER: <span id="hunger-val">0</span>%</div>
        <div class="status-bar">FEELS: <span id="feels-val">0</span>%</div>
        
        <img src="drake-pixel.png" class="drake-avatar" id="avatar">
        
        <div class="message-log" id="log">6 GOD ONLINE</div>
    </div>

    <div class="controls-overlay">
        <button onclick="feed('nobu')">NOBU</button>
        <button onclick="feed('henny')">HENNY</button>
        <button onclick="blockText()">BLOCK EX</button>
    </div>
</div>

<script>
    // Game State
    let hunger = 20;
    let feelings = 10;
    let isGameOver = false;
    let gameLoop;

    // DOM Elements
    const hungerEl = document.getElementById('hunger-val');
    const feelsEl = document.getElementById('feels-val');
    const logEl = document.getElementById('log');
    const avatar = document.getElementById('avatar');
    const screen = document.getElementById('screen');

    function updateDisplay() {
        hungerEl.innerText = hunger;
        feelsEl.innerText = feelings;
        
        // Visual Logic
        if (feelings > 70) {
            logEl.innerText = "Listening to Take Care...";
            avatar.classList.add('marvins-room'); // Sad mode
        } else {
            avatar.classList.remove('marvins-room');
        }

        // Color warnings
        if (hunger > 80) hungerEl.style.color = "red";
        else hungerEl.style.color = "black";
        
        if (feelings > 80) feelsEl.style.color = "red";
        else feelsEl.style.color = "black";
    }

    function log(msg) {
        logEl.innerText = msg;
        setTimeout(() => {
            if(logEl.innerText === msg) logEl.innerText = "...";
        }, 2000);
    }

    // Actions
    function feed(type) {
        if (isGameOver) return;

        if (type === 'nobu') {
            hunger = Math.max(0, hunger - 20);
            feelings = Math.max(0, feelings - 5); // Good food helps
            log("Ate Lobster. Rich.");
        } else if (type === 'henny') {
            hunger = Math.max(0, hunger - 5);
            feelings = Math.min(100, feelings + 15); // Alcohol increases feelings!
            log("Sipping Henny...");
            avatar.style.animation = "shake 0.5s"; // Shake effect
            setTimeout(() => avatar.style.animation = "bounce 2s infinite", 500);
        }
        updateDisplay();
    }

    function blockText() {
        if (isGameOver) return;
        
        if (feelings > 0) {
            feelings = Math.max(0, feelings - 25);
            log("Phone snatched.");
        } else {
            log("He's already chill.");
        }
        updateDisplay();
    }

    // The Game Loop
    function startGame() {
        gameLoop = setInterval(() => {
            if (isGameOver) return;

            // Stats rise naturally
            hunger += 2;
            feelings += 3; // Feelings rise faster than hunger because it's Drake

            // Checks
            if (hunger >= 100) {
                gameOver("He starved.");
            }
            if (feelings >= 100) {
                gameOver("TEXT SENT: 'U UP?'");
            }

            updateDisplay();
        }, 1000); // Updates every second
    }

    function gameOver(reason) {
        isGameOver = true;
        clearInterval(gameLoop);
        logEl.innerText = "GAME OVER";
        alert("GAME OVER: " + reason);
        // Reset option
        if(confirm("Play again?")) {
            hunger = 20;
            feelings = 10;
            isGameOver = false;
            startGame();
        }
    }

    // Start
    startGame();

</script>
</body>
</html>
