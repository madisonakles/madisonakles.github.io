<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drake-Gotchi: Passionfruit Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden; /* Prevent scrolling when sidebar opens */
        }

        .tamagotchi-wrapper {
            position: relative;
            width: 450px; 
            height: auto;
            display: inline-block; 
        }

        /* --- LAYERS --- */
        
        /* 1. The Shell (FRONT LAYER) */
        .shell-img {
            width: 100%;
            display: block;
            position: relative;
            z-index: 10;
            pointer-events: none; 
            user-select: none;
        }

        /* 2. The Screen (BACK LAYER) */
        .game-screen {
            position: absolute;
            z-index: 1; 
            top: 37%;    
            left: 20%;     
            width: 44%;    
            height: 32%;   
            background-color: #9ea78b; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px; 
            box-sizing: border-box;
        }

        .game-screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* --- GAME UI --- */
        .status-bar {
            font-size: 8px;
            color: #111;
            text-shadow: 1px 1px 0px rgba(160, 172, 134, 0.8);
            margin-bottom: 2px;
        }

        /* UPDATED: Much Larger Drake */
        .drake-avatar {
            width: 80px;  /* Increased from 48px */
            height: 80px; /* Increased from 48px */
            align-self: center;
            image-rendering: pixelated; 
            animation: bounce 2s infinite;
            margin-top: -5px; /* Slight adjust to center him */
        }

        .message-log {
            font-size: 6px;
            text-align: center;
            min-height: 8px;
            color: #111;
            margin-top: 4px;
        }

        /* --- CONTROLS --- */
        .controls-container {
            position: absolute;
            bottom: 12%; 
            left: 21%;
            width: 58%;
            display: flex;
            justify-content: space-between;
            z-index: 20; 
        }

        button {
            background: #222;
            color: #f0f0f0;
            border: 1px solid #555;
            font-family: 'Press Start 2P';
            font-size: 7px;
            padding: 6px 8px;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        button:hover { background: #444; }
        button:active { transform: translate(1px, 1px); box-shadow: none; }

        /* --- MUSIC TOGGLE (Top Right Corner) --- */
        .music-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            font-size: 10px;
            background: #fff;
            color: #000;
            border: 2px solid #000;
        }

        /* --- GAME OVER SIDEBAR --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px; /* Hidden by default */
            width: 250px;
            height: 100%;
            background: #111;
            color: #fff;
            z-index: 50;
            transition: right 0.5s ease-in-out;
            border-left: 4px solid #d4af37; /* OVO Gold */
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar h2 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .sidebar p {
            font-size: 10px;
            line-height: 1.8;
            margin-bottom: 30px;
            color: #ccc;
        }

        .restart-btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 15px;
            font-size: 10px;
        }

        /* --- ANIMATIONS --- */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .marvins-room {
            filter: grayscale(100%) contrast(120%);
            animation: none;
        }
    </style>
</head>
<body>

<button class="music-toggle" id="musicBtn" onclick="toggleMusic()">🎵 Music: OFF</button>

<div id="player" style="display:none;"></div>

<div class="sidebar" id="gameOverSidebar">
    <h2>GAME OVER</h2>
    <p>YOU LET DRAKE TEXT HIS EX.</p>
    <p>He sent: "I miss who we were."</p>
    <button class="restart-btn" onclick="location.reload()">TRY AGAIN</button>
</div>

<div class="tamagotchi-wrapper">
    <div class="game-screen" id="screen">
        <div style="width: 100%;">
            <div class="status-bar">HUNGRY: <span id="hunger-val">0</span>%</div>
            <div class="status-bar">FEELS: <span id="feels-val">0</span>%</div>
        </div>
        <img src="drake-pixel.png" class="drake-avatar" id="avatar">
        <div class="message-log" id="log">6 GOD ONLINE</div>
    </div>

    <img src="shell.png" alt="Drake Tamagotchi" class="shell-img">

    <div class="controls-container">
        <button onclick="feed('nobu')">Nobu</button>
        <button onclick="feed('henny')">Henny</button>
        <button onclick="blockText()">Block</button>
    </div>
</div>

<script>
    /* --- 1. YOUTUBE API SETUP --- */
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var isMusicPlaying = false;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '0',
            width: '0',
            videoId: 'MPw0Fswlrbw', // Passionfruit 8-Bit
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        // Player is ready. We wait for user interaction to play.
        // We set volume to 50%
        event.target.setVolume(50);
    }

    function toggleMusic() {
        if (!player || !player.playVideo) return;
        
        const btn = document.getElementById('musicBtn');
        if (isMusicPlaying) {
            player.pauseVideo();
            btn.innerText = "🎵 Music: OFF";
            isMusicPlaying = false;
        } else {
            player.playVideo();
            btn.innerText = "🎵 Music: ON";
            isMusicPlaying = true;
        }
    }

    /* --- 2. GAME LOGIC --- */
    let hunger = 20;
    let feelings = 10;
    let isGameOver = false;
    let gameLoop;

    const hungerEl = document.getElementById('hunger-val');
    const feelsEl = document.getElementById('feels-val');
    const logEl = document.getElementById('log');
    const avatar = document.getElementById('avatar');
    const sidebar = document.getElementById('gameOverSidebar');

    function updateDisplay() {
        hungerEl.innerText = hunger;
        feelsEl.innerText = feelings;
        
        // Marvin's Room Mode (Sadness)
        if (feelings > 70) {
            if(!avatar.classList.contains('marvins-room')) {
                logEl.innerText = "Listening to Take Care...";
                avatar.classList.add('marvins-room');
            }
        } else {
            avatar.classList.remove('marvins-room');
        }

        hungerEl.style.color = hunger > 80 ? "#8b0000" : "#111";
        feelsEl.style.color = feelings > 80 ? "#8b0000" : "#111";
    }

    function log(msg) {
        logEl.innerText = msg;
        setTimeout(() => { if(logEl.innerText === msg) logEl.innerText = "..."; }, 2000);
    }

    function feed(type) {
        if (isGameOver) return;
        // First interaction starts music if user hasn't toggled it yet? 
        // Let's leave it optional via the button, or uncomment below to auto-start:
        // if (!isMusicPlaying && player && player.playVideo) toggleMusic();

        if (type === 'nobu') {
            hunger = Math.max(0, hunger - 20);
            feelings = Math.max(0, feelings - 5);
            log("Eating Calamari.");
        } else if (type === 'henny') {
            hunger = Math.max(0, hunger - 5);
            feelings = Math.min(100, feelings + 15); // Henny spikes feelings
            log("Sipping Henny.");
            
            avatar.style.animation = "shake 0.5s";
            setTimeout(() => {
                if(!avatar.classList.contains('marvins-room')) {
                    avatar.style.animation = "bounce 2s infinite";
                } else {
                    avatar.style.animation = "none";
                }
            }, 500);
        }
        updateDisplay();
    }

    function blockText() {
        if (isGameOver) return;
        if (feelings > 0) {
            feelings = Math.max(0, feelings - 25);
            log("Phone snatched.");
        } else {
            log("He's chilling.");
        }
        updateDisplay();
    }

    function startGame() {
        gameLoop = setInterval(() => {
            if (isGameOver) return;
            
            hunger += 2;
            feelings += 3;

            if (hunger >= 100) triggerGameOver("He starved to death.");
            if (feelings >= 100) triggerGameOver("You let Drake text his ex.");

            updateDisplay();
        }, 1000);
    }

    function triggerGameOver(reason) {
        isGameOver = true;
        clearInterval(gameLoop);
        
        // Update Sidebar Text based on reason
        const pTags = sidebar.getElementsByTagName('p');
        pTags[0].innerText = "GAME OVER";
        pTags[1].innerText = reason.toUpperCase();
        
        // Show Sidebar
        sidebar.classList.add('active');
        
        // Optional: Force music on if it wasn't already?
        // if (!isMusicPlaying) toggleMusic();
    }

    startGame();
</script>
</body>
</html>
